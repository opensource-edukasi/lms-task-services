syntax = "proto3";
package tasks;

option go_package = "lms-task-service/pb/tasks;tasks";

import "generic/generic_message.proto";

// Task messages
message Task {
    string id = 1;
    string subject_class_id = 2;
    string type = 3;
    string name = 4;
    string description = 5;
    string end_date = 6;
    string created_at = 7;
    string updated_at = 8;
    string updated_by = 9;
    repeated TaskFile files = 10;
}

message TaskFile {
    string id = 1;
    string task_id = 2;
    string name = 3;
    string description = 4;
    string storage_id = 5;
    string created_at = 6;
    string updated_at = 7;
    string updated_by = 8;
}

message TaskInput {
    string subject_class_id = 1;
    string type = 2;
    string name = 3;
    string description = 4;
    string end_date = 5;
    repeated TaskFileInput files = 6;
}

message TaskFileInput {
    string name = 1;
    string description = 2;
    string storage_id = 3;
}

message TaskUpdate {
    string id = 1;
    string subject_class_id = 2;
    string type = 3;
    string name = 4;
    string description = 5;
    string end_date = 6;
}

// Student Task messages
message StudentTask {
    string id = 1;
    string task_id = 2;
    string student_id = 3;
    string answer = 4;
    int32 score = 5;
    string feedback = 6;
    string created_at = 7;
    repeated StudentTaskFile files = 8;
    repeated FeedbackFile feedback_files = 9;
}

message StudentTaskFile {
    string id = 1;
    string student_task_id = 2;
    string name = 3;
    string description = 4;
    string file_type = 5;
    string storage_id = 6;
    string source = 7;
    string created_at = 8;
    string updated_at = 9;
    string updated_by = 10;
}

message FeedbackFile {
    string id = 1;
    string student_task_id = 2;
    string name = 3;
    string description = 4;
    string storage_id = 5;
    string created_at = 6;
    string updated_at = 7;
    string updated_by = 8;
}

message StudentTaskInput {
    string task_id = 1;
    string student_id = 2;
    string answer = 3;
    repeated StudentTaskFileInput files = 4;
}

message StudentTaskFileInput {
    string name = 1;
    string description = 2;
    string file_type = 3;
    string storage_id = 4;
    string source = 5;
}

message GradeInput {
    string student_task_id = 1;
    int32 score = 2;
    string feedback = 3;
    repeated FeedbackFileInput feedback_files = 4;
}

message FeedbackFileInput {
    string name = 1;
    string description = 2;
    string storage_id = 3;
}

message StudentTaskList {
    repeated StudentTask student_tasks = 1;
    uint32 count = 2;
}

message StudentTaskListInput {
    lms_task_services.Pagination pagination = 1;
    string task_id = 2;
}

// Task Service
service TaskService {
    rpc Create(TaskInput) returns (Task);
    rpc Get(lms_task_services.Id) returns (Task);
    rpc Update(TaskUpdate) returns (Task);
    rpc Delete(lms_task_services.Id) returns (lms_task_services.BoolMessage);
    rpc StudentSubmit(StudentTaskInput) returns (StudentTask);
    rpc TeacherGrade(GradeInput) returns (StudentTask);
    rpc ListStudentTasks(StudentTaskListInput) returns (StudentTaskList);
}
